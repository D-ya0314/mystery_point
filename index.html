<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ポイント獲得</title>
  </head>
  <body>
    <h1>ポイント獲得</h1>
    <p id="status">処理中...</p>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script>
      const LIFF_ID = "2011066044-WuCEcTtF";

      // ここにGASのWebアプリURL
      const GAS_URL =
        "https://script.google.com/macros/s/AKfycbz1eSFLwxabykW89URs1gj_FBjxEeMJr6GjUOYYUdgqaS4pW9hPjVresViL_XM5bu6r/exec";

      async function main() {
        try {
          // LIFF初期化
          await liff.init({
            liffId: LIFF_ID,
          });

          // LINEログイン確認
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }

          // LINEプロフィール取得
          const profile = await liff.getProfile();

          const userId = profile.userId;
          const displayName = profile.displayName;

          console.log("userId:", userId);
          console.log("displayName:", displayName);

          document.getElementById("status").textContent = "userId取得成功！";

          const response = await fetch(GAS_URL, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8",
            },
            body: JSON.stringify({
              userId: userId,
              displayName: displayName,
            }),
          });
          const result = await response.json();
          if (result.granted) {
            document.getElementById("status").textContent =
              `${result.point}ポイント獲得しました！`;
          } else {
            document.getElementById("status").textContent =
              "本日のポイントは獲得済みです。";
          }
          console.log("GAS response:", result);
        } catch (error) {
          console.error(error);

          document.getElementById("status").textContent =
            "エラーが発生しました";
        }
      }

      main();
    </script>
  </body>
</html>
